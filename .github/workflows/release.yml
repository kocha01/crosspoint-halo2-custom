name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      - name: Determine release name
        id: release_name
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == 2.0.* ]]; then
            ALPHA=$(echo $TAG | cut -d. -f3)
            echo "name=CrossPoint Halo 2 Alpha $ALPHA" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == 2.1.* ]]; then
            PATCH=$(echo $TAG | cut -d. -f3)
            BETA=$((PATCH + 1))
            echo "name=CrossPoint Halo 2 Beta $BETA" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == 2.2.* ]]; then
            PATCH=$(echo $TAG | cut -d. -f3)
            if [[ "$PATCH" == "0" ]]; then
              echo "name=CrossPoint Halo 2" >> $GITHUB_OUTPUT
            else
              echo "name=CrossPoint Halo 2 ($TAG)" >> $GITHUB_OUTPUT
            fi
          else
            echo "name=CrossPoint Halo 2 ($TAG)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/gh_release/firmware.bin
          name: ${{ steps.release_name.outputs.name }}
          body: ${{ steps.release_name.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
